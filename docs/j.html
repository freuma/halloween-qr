<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Acertijo</title>
<style>
  :root { --fondo:#050505; --texto:#e8e2d4; --tenue:#8a8578; --sangre:#b3121b; --ok:#7fb069; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--fondo); color:var(--texto);
    font-family: Georgia, "Times New Roman", serif; -webkit-tap-highlight-color:transparent; }
  body { display:flex; align-items:center; justify-content:center; padding:24px 16px; text-align:center; }
  main { max-width:420px; width:100%; }
  .eleccion { color:var(--tenue); font-size:15px; margin-bottom:10px; }
  .opcion { font-size:26px; margin-bottom:36px; }
  .toca { font-size:22px; letter-spacing:.04em; animation: latido 2.4s ease-in-out infinite; }
  @keyframes latido { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  .resultado h1 { font-size:34px; margin-bottom:14px; }
  .resultado.ok h1 { color:var(--ok); }
  .resultado.mal h1 { color:var(--sangre); }
  .resultado p { font-size:19px; line-height:1.45; margin-bottom:12px; }
  .nota { color:var(--tenue); font-size:15px; }
  .contador { margin-top:30px; color:var(--tenue); font-size:15px; }
  [hidden] { display:none !important; }

  /* Susto */
  #susto { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:10; overflow:hidden; }
  #susto svg { width:130vmax; height:130vmax; max-width:none; }
  #susto.entra svg { animation: zoom .22s cubic-bezier(.1,.9,.2,1) both, tiembla .09s linear .22s 14; }
  #susto.entra::after { content:""; position:absolute; inset:0; background:var(--sangre); opacity:0; animation: rojo .5s ease-out both; }
  @keyframes zoom { from { transform:scale(.15) } to { transform:scale(1) } }
  @keyframes tiembla { 0%,100% { transform:translate(0,0) scale(1) } 25% { transform:translate(-1.4%,1%) scale(1.02) } 75% { transform:translate(1.4%,-1%) scale(1.02) } }
  @keyframes rojo { 0% { opacity:.55 } 100% { opacity:0 } }
  @media (prefers-reduced-motion: reduce) {
    #susto.entra svg { animation:none; }
    #susto.entra::after { animation:none; }
  }
</style>
</head>
<body>

<main id="pantalla">
  <p class="eleccion">Has elegido…</p>
  <p class="opcion" id="opcion"></p>
  <p class="toca" id="toca">Toca para saber si has acertado</p>

  <section class="resultado" id="resultado" hidden>
    <h1 id="titulo"></h1>
    <p id="mensaje"></p>
    <p class="nota" id="nota"></p>
    <p class="contador" id="contador"></p>
  </section>
</main>

<div id="susto" hidden></div>

<script src="datos.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var q = parseInt(params.get("q"), 10);
  var o = parseInt(params.get("o"), 10);
  var acertijo = ACERTIJOS.filter(function (a) { return a.id === q; })[0];
  var opcionEl = document.getElementById("opcion");

  if (!acertijo || !(o >= 0 && o < acertijo.opciones.length)) {
    opcionEl.textContent = "Este código no es de ningún acertijo.";
    document.getElementById("toca").hidden = true;
    return;
  }
  opcionEl.textContent = acertijo.opciones[o];

  var acierto = (o === acertijo.correcta);
  var hecho = false;

  /* Progreso guardado en el propio móvil; si no hay almacenamiento, no pasa nada. */
  function leerResueltos() {
    try { return JSON.parse(localStorage.getItem("resueltos") || "[]"); } catch (e) { return []; }
  }
  function guardarResuelto(id) {
    var r = leerResueltos();
    if (r.indexOf(id) === -1) r.push(id);
    try { localStorage.setItem("resueltos", JSON.stringify(r)); } catch (e) {}
    return r.length;
  }

  /* Sonido sintetizado: nada que descargar. Solo suena tras un toque. */
  var ctx = null;
  function desbloquearAudio() {   /* dentro del toque: iOS lo exige */
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      if (ctx.resume) ctx.resume();
    } catch (e) { ctx = null; }
  }
  function gritar() {
    if (!ctx) return;
    try {
      var t = ctx.currentTime;
      var master = ctx.createGain();
      master.gain.setValueAtTime(0.0001, t);
      master.gain.exponentialRampToValueAtTime(1, t + 0.02);
      master.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);

      var curva = new Float32Array(256);
      for (var i = 0; i < 256; i++) { var x = i / 128 - 1; curva[i] = Math.tanh(x * 6); }
      var dist = ctx.createWaveShaper(); dist.curve = curva;
      dist.connect(master); master.connect(ctx.destination);

      [880, 1320, 1760].forEach(function (f, k) {
        var osc = ctx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(f, t);
        osc.frequency.exponentialRampToValueAtTime(f * (k % 2 ? 0.55 : 1.45), t + 1.4);
        var lfo = ctx.createOscillator(); lfo.frequency.value = 34 + k * 7;
        var prof = ctx.createGain(); prof.gain.value = f * 0.05;
        lfo.connect(prof); prof.connect(osc.frequency);
        var g = ctx.createGain(); g.gain.value = 0.33;
        osc.connect(g); g.connect(dist);
        osc.start(t); lfo.start(t); osc.stop(t + 1.6); lfo.stop(t + 1.6);
      });

      var buf = ctx.createBuffer(1, ctx.sampleRate * 1.6, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var n = 0; n < d.length; n++) d[n] = Math.random() * 2 - 1;
      var ruido = ctx.createBufferSource(); ruido.buffer = buf;
      var filtro = ctx.createBiquadFilter(); filtro.type = "bandpass"; filtro.frequency.value = 2400; filtro.Q.value = 0.7;
      var gr = ctx.createGain(); gr.gain.value = 0.9;
      ruido.connect(filtro); filtro.connect(gr); gr.connect(dist);
      ruido.start(t);
    } catch (e) {}
  }

  var CARAS = SUSTOS;   /* SVG de datos.js */
  function susto(alAcabar) {
    var cont = document.getElementById("susto");
    cont.innerHTML = CARAS[Math.floor(Math.random() * CARAS.length)];
    cont.hidden = false;
    void cont.offsetWidth;
    cont.className = "entra";
    gritar();
    try { if (navigator.vibrate) navigator.vibrate([400, 60, 250, 60, 600]); } catch (e) {}
    setTimeout(function () {
      cont.hidden = true; cont.className = ""; cont.innerHTML = "";
      alAcabar();
    }, 2300);
  }

  function mostrar(conSusto) {
    var res = document.getElementById("resultado");
    var titulo = document.getElementById("titulo");
    var mensaje = document.getElementById("mensaje");
    var nota = document.getElementById("nota");
    document.getElementById("toca").hidden = true;
    document.querySelector(".eleccion").hidden = true;
    opcionEl.hidden = true;
    if (acierto) {
      var total = guardarResuelto(acertijo.id);
      res.className = "resultado ok";
      titulo.textContent = "Correcto";
      mensaje.textContent = acertijo.premio;
      nota.textContent = conSusto ? "El susto era de regalo." : "";
      document.getElementById("contador").textContent = "Acertijos resueltos: " + total + " de " + ACERTIJOS.length;
    } else {
      res.className = "resultado mal";
      titulo.textContent = "Has fallado";
      mensaje.textContent = "Otra opción de este folio puede salvarte.";
      nota.textContent = "";
      var r = leerResueltos().length;
      if (r) document.getElementById("contador").textContent = "Acertijos resueltos: " + r + " de " + ACERTIJOS.length;
    }
    res.hidden = false;
  }

  /* Si hay una pantalla del aula escuchando (calavera.html?juego), le llega qué opción se ha elegido.
     Va por ntfy.sh; si falla, el juego del móvil sigue igual. */
  function avisarPantalla() {
    try {
      fetch("https://ntfy.sh/" + CANAL, { method: "POST", body: JSON.stringify({ q: q, o: o }), keepalive: true }).catch(function () {});
    } catch (e) {}
  }

  document.body.addEventListener("click", function () {
    if (hecho) return;
    hecho = true;
    desbloquearAudio();
    avisarPantalla();
    var toca = document.getElementById("toca");
    toca.style.animation = "none"; toca.style.opacity = ".2";

    var asusta = !acierto || Math.random() < PROB_SUSTO_ACIERTO;
    if (!asusta) { mostrar(false); return; }
    /* Silencio breve y variable antes del susto: que no sepan cuándo. */
    var espera = 250 + Math.random() * 1500;
    setTimeout(function () { susto(function () { mostrar(acierto); }); }, espera);
  });
})();
</script>
</body>
</html>
